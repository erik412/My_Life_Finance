<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />

    <title>My Life Finance - Sign Up</title>
  </head>
  <body class="signup-page">
    <div class="signup-header">
      <span>We're exicted you've chosen to sign up.</span>
    </div>
    <div class="signup-info">
      <span
        >My Life Finance was started to help me achieve multiple things in life.
        <ul>
          <li>Get my finances in order.</li>
          <li>Learn full stack web developement.</li>
        </ul>
      </span>
    </div>
    <div class="form-container">
      <div class="name-label">
        <h2>Who do we have the pleasure of meeting?</h2>
      </div>
      <form id="registration-form">
        <input
          type="first-name"
          name="first-name"
          id="first-name"
          placeholder="First Name"
          required
        />
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
