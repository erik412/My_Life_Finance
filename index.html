<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-container">
        <div class="left-side">left</div>
        <div class="right-side">right</div>
    </header>
    <div class="main-container">
        <div class="left-main">Left Main</div>
        <div class="right-main">
            <div class="form-container">
                <h2>Who do we have the pleasure of meeting?</h2>
                <form sclass="signup-form" id="signup-form">
                    <div class="input-row">
                        <input class="input-fields" type="text" name="first-name" id="first-name" placeholder="First Name">
                        <input class="input-fields" type="text" name="last-name" id="last-name" placeholder="Last Name">
                    </div>
                    <button class="next-button" id="next-page"  type="submit">Submit</button>
                </form>
            </div>
        </div>
        
    </div> 
    <script src="script.js" defer></script>
</body>
</html>
